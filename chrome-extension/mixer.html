<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BEQ Mixer</title>
<link rel="icon" sizes="16x16" href="assets/icon16.png">
<link rel="icon" sizes="32x32" href="assets/icon32.png">
<link rel="icon" sizes="48x48" href="assets/icon48.png">
<link rel="icon" sizes="128x128" href="assets/icon128.png">
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="mixer.css">
</head>
<body class="window">
  <header>
    <img id="title" src="assets/title0.png" alt="Born To EQ The World">
    <div class="master" title="Master: every tab that is on. Drag up or down, scroll, or double-click for 0 dB">
      <span class="label">Master</span>
      <svg id="knob" viewBox="0 0 48 48" width="42" height="42" tabindex="0">
        <circle cx="24" cy="24" r="17" class="knob-body"/>
        <path id="knobTrack" class="knob-track"/>
        <path id="knobArc" class="knob-arc"/>
        <line id="knobPointer" x1="24" y1="24" x2="24" y2="12" class="knob-pointer"/>
      </svg>
      <span id="masterValue" class="value">0.0 dB</span>
      <button id="masterMute" class="pill small" title="Mute every tab playing sound">Mute</button>
    </div>
  </header>
  <div class="sub"><span class="label">Mixer</span><span class="hint">Every tab playing sound</span>
    <button id="spectrum" class="pill small" title="Open the spectrum window: everything playing through BEQ, with a long average">Spectrum ↗</button>
    <select id="size" title="Mixer size (the window grows or shrinks with it)">
      <option value="0.8">80%</option>
      <option value="0.9">90%</option>
      <option value="1">100%</option>
      <option value="1.15">115%</option>
      <option value="1.3">130%</option>
      <option value="1.5">150%</option>
      <option value="1.75">175%</option>
    </select></div>

  <div id="rows"></div>
  <div id="empty" class="panel empty">No tabs are playing sound right now.</div>

  <div id="themeNote" class="status"></div>
  <footer>
    <div id="swatches" class="swatches"></div>
    <select id="background" title="Background. BEQ picks its colours from it and adds them as the last dot">
      <option value="forest">Forest</option>
      <option value="Sunset">Sunset</option>
      <option value="Ocean">Ocean</option>
      <option value="Neon">Neon</option>
      <option value="Moss">Moss</option>
      <option value="Concrete">Concrete</option>
      <option value="custom">Your own image...</option>
    </select>
    <input id="imageFile" type="file" accept="image/*" hidden>
    <div class="lagrangian" title="The Standard Model"></div>
  </footer>
  <script type="module" src="mixer.js"></script>
</body>
</html>
