<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BEQ Spectrum</title>
<link rel="icon" sizes="16x16" href="assets/icon16.png">
<link rel="icon" sizes="32x32" href="assets/icon32.png">
<link rel="icon" sizes="48x48" href="assets/icon48.png">
<link rel="icon" sizes="128x128" href="assets/icon128.png">
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="spectrum.css">
</head>
<body class="window spectrum">
  <header>
    <img id="title" src="assets/title0.png" alt="Born To EQ The World">
    <div class="head-buttons">
      <button id="reset" class="pill small" title="Start the average again">Reset</button>
      <button id="toggleSettings" class="pill small" title="Show or hide the settings">Settings</button>
    </div>
  </header>
  <div class="sub"><span class="label">Spectrum</span><span id="hint" class="hint"></span><span id="readout" class="readout"></span></div>

  <section class="panel plot">
    <canvas id="plot"></canvas>
    <div id="idle" class="idle" hidden>Nothing is playing through BEQ. Turn a tab on and it shows here.</div>
  </section>

  <section id="settings" class="panel settings">
    <label>Measure
      <select id="where">
        <option value="pre">Before EQ</option>
        <option value="post">After EQ</option>
      </select></label>
    <label>Show
      <select id="view">
        <option value="both">Live + average</option>
        <option value="avg">Average</option>
        <option value="live">Live</option>
      </select></label>
    <label>Average time
      <select id="avgMs">
        <option value="1000">1 s</option>
        <option value="3000">3 s</option>
        <option value="6000">6 s</option>
        <option value="10000">10 s</option>
        <option value="30000">30 s</option>
        <option value="0">Until reset</option>
      </select></label>
    <label>Block size
      <select id="block">
        <option>2048</option><option>4096</option><option>8192</option><option>16384</option><option>32768</option>
      </select></label>
    <label>Overlap
      <select id="overlap">
        <option value="0.5">50%</option><option value="0.75">75%</option><option value="0.88">88%</option>
      </select></label>
    <label>Slope
      <select id="slope">
        <option value="0">0 dB/oct</option><option value="3">3 dB/oct</option><option value="4.5">4.5 dB/oct</option><option value="6">6 dB/oct</option>
      </select></label>
    <label>Smoothing
      <select id="smooth">
        <option value="0">Off</option><option value="0.0833">1/12 oct</option><option value="0.1667">1/6 oct</option>
        <option value="0.3333">1/3 oct</option><option value="0.6667">2/3 oct</option><option value="1">1 oct</option>
      </select></label>
    <label>Range low, dB <input id="lo" type="number" step="1" min="-160" max="20"></label>
    <label>Range high, dB <input id="hi" type="number" step="1" min="-150" max="30"></label>
    <label>Freq low, Hz <input id="fLo" type="number" step="1" min="10" max="10000"></label>
    <label>Freq high, Hz <input id="fHi" type="number" step="100" min="200" max="24000"></label>
    <button id="defaults" class="btn" title="Back to the mastering defaults">Defaults</button>
  </section>
  <script type="module" src="spectrum.js"></script>
</body>
</html>
