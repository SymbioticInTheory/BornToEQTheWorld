<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BEQ Spectrum</title>
<link rel="icon" sizes="16x16" href="assets/icon16.png">
<link rel="icon" sizes="32x32" href="assets/icon32.png">
<link rel="icon" sizes="48x48" href="assets/icon48.png">
<link rel="icon" sizes="128x128" href="assets/icon128.png">
<link rel="stylesheet" href="popup.css">
<link rel="stylesheet" href="spectrum.css">
</head>
<body class="window spectrum">
  <header>
    <img id="title" src="assets/title0.png" alt="Born To EQ The World">
    <div class="head-buttons">
      <label class="tune" title="Which sound to show: one tab, with its own EQ drawn over it to tune (drag its points, scroll on one for Q, double-click for 0 dB), or all of Chrome">Source
        <select id="tune"></select></label>
      <button id="showEq" class="pill small" title="Show or hide the tab's EQ over the spectrum. Hiding it only hides the drawing: the EQ keeps playing">EQ shown</button>
      <button id="toggleSettings" class="pill small" title="Show or hide the analyser settings">Settings</button>
    </div>
  </header>
  <div class="sub"><span class="label">Spectrum</span><span id="hint" class="hint"></span><span id="readout" class="readout"></span></div>

  <section class="panel plot">
    <canvas id="plot"></canvas>
    <div id="range" class="range" title="Zoom the level axis: drag the ends in or out, drag the middle to move it, scroll on it, double-click for the default"><div id="rangeThumb" class="range-thumb"></div></div>
    <div id="idle" class="idle" hidden>Nothing is playing through BEQ from here. Turn a tab on and it shows here.</div>
  </section>

  <section id="settings" class="panel settings">
    <div class="picks">
      <label>Measure
        <select id="where">
          <option value="pre">Before EQ</option>
          <option value="post">After EQ</option>
        </select></label>
      <label>Show
        <select id="view">
          <option value="both">Live + average</option>
          <option value="avg">Average</option>
          <option value="live">Live</option>
        </select></label>
      <label>Block size
        <select id="block">
          <option>2048</option><option>4096</option><option>8192</option><option>16384</option><option>32768</option>
        </select></label>
      <label>Smoothing
        <select id="smooth" title="Averages over this many octaves, so the shape is easier to read"></select></label>
      <div class="pick-buttons">
        <button id="reset" class="btn" title="Start the average again (or double-click the graph)">Reset</button>
        <button id="defaults" class="btn" title="Back to the mastering defaults">Defaults</button>
      </div>
    </div>
    <div id="knobs" class="knobs"></div>
  </section>
  <script type="module" src="spectrum.js"></script>
</body>
</html>
